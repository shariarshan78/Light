
<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Light — AI</title>
  <meta name="theme-color" content="#0f172a" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💡</text></svg>" />
  <style>
    :root {
      --bg: #0b1120;
      --card: #1e293b;
      --border: #334155;
      --accent: #38bdf8;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --user: #0ea5e9;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100dvh;
      display: flex;
      flex-direction: column;
    }
    .header {
      background: var(--card);
      padding: 14px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
    }
    .logo {
      font-size: 1.35rem;
      font-weight: 700;
      color: var(--accent);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .logo small { font-size: 0.75rem; color: var(--muted); font-weight: 400; }
    .status {
      font-size: 0.8rem;
      color: #4ade80;
      background: #14532d44;
      padding: 4px 10px;
      border-radius: 20px;
    }
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .msg {
      max-width: 88%;
      padding: 12px 16px;
      border-radius: 18px;
      line-height: 1.55;
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 0.95rem;
      animation: fadeIn 0.25s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: none; }
    }
    .user {
      align-self: flex-end;
      background: var(--user);
      color: white;
      border-bottom-right-radius: 5px;
    }
    .assistant {
      align-self: flex-start;
      background: var(--card);
      border: 1px solid var(--border);
      border-bottom-left-radius: 5px;
    }
    .system {
      align-self: center;
      background: #1e293b88;
      color: var(--muted);
      font-size: 0.82rem;
      text-align: center;
      max-width: 95%;
      border: 1px dashed var(--border);
    }
    .input-area {
      padding: 12px 14px;
      background: var(--card);
      border-top: 1px solid var(--border);
      display: flex;
      gap: 8px;
      align-items: center;
    }
    #prompt {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 12px 16px;
      border-radius: 14px;
      font-size: 1rem;
      outline: none;
    }
    #prompt:focus { border-color: var(--accent); }
    #send-btn {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      background: var(--accent);
      color: #0f172a;
      border: none;
      font-size: 1.2rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #send-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">
      💡 Light
      <small>Cloud AI</small>
    </div>
    <div class="status">● Online</div>
  </div>

  <div id="chat"></div>

  <form class="input-area" id="chat-form">
    <input id="prompt" type="text" placeholder="Bangla / English / Banglish লিখো..." autocomplete="off" />
    <button type="submit" id="send-btn">➤</button>
  </form>

  <script>
    // ========== GROQ API KEY ==========
    const GROQ_API_KEY = "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";
    // ==================================

    const chat = document.getElementById("chat");
    const form = document.getElementById("chat-form");
    const promptInput = document.getElementById("prompt");
    const sendBtn = document.getElementById("send-btn");

    const SYSTEM_PROMPT = `তুমি Light। একজন বন্ধুসুলভ, স্মার্ট এবং সাহায্যকারী AI।

ভাষার নিয়ম:
- ইউজার বাংলায় লিখলে বাংলায় উত্তর দাও
- ইংরেজিতে লিখলে ইংরেজিতে উত্তর দাও
- Banglish-এ লিখলে Banglish-এ উত্তর দাও
- মিক্স করলে স্বাভাবিকভাবে মিক্স করে উত্তর দাও

ব্যক্তিত্ব: বন্ধুসুলভ, স্মার্ট, হেল্পফুল এবং কাজে লাগার মতো উত্তর দাও।`;

    let messages = [
      { role: "system", content: SYSTEM_PROMPT }
    ];

    function addMessage(role, text) {
      const div = document.createElement("div");
      div.className = `msg ${role}`;
      div.textContent = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
      return div;
    }

    addMessage("system", "👋 আমি Light (Cloud AI)\nএখন অনেক দ্রুত এবং ভালো বুঝি।\nকিছু একটা লিখে পাঠাও!");

    form.onsubmit = async (e) => {
      e.preventDefault();
      const text = promptInput.value.trim();
      if (!text) return;

      if (!GROQ_API_KEY) {
        addMessage("system", "⚠️ API Key পাওয়া যায়নি!");
        return;
      }

      promptInput.value = "";
      promptInput.disabled = true;
      sendBtn.disabled = true;

      addMessage("user", text);
      messages.push({ role: "user", content: text });

      const assistantDiv = addMessage("assistant", "▋");

      try {
        const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${GROQ_API_KEY}`
          },
          body: JSON.stringify({
            model: "llama-3.1-8b-instant",
            messages: messages,
            temperature: 0.7,
            stream: false
          })
        });

        const data = await response.json();

        if (data.error) {
          assistantDiv.textContent = "❌ Error: " + data.error.message;
        } else {
          const reply = data.choices[0].message.content;
          assistantDiv.textContent = reply;
          messages.push({ role: "assistant", content: reply });
        }
      } catch (err) {
        assistantDiv.textContent = "❌ নেটওয়ার্ক এরর: " + err.message;
      }

      promptInput.disabled = false;
      sendBtn.disabled = false;
      promptInput.focus();
    };
  </script>
</body>
</html>
